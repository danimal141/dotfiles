# Global language runtime versions for mise.
#
# このファイルは mise の global config で、全プロジェクトのデフォルト
# バージョンを宣言する。プロジェクト個別の上書きは <project>/mise.toml
# または <project>/.tool-versions で行う。
#
# mise の解決優先度 (上ほど優先):
#   1. <project>/mise.toml | <project>/.mise.toml
#   2. <project>/.tool-versions
#   3. ~/.config/mise/config.toml      ← このファイル
#   4. ~/.tool-versions                ← 旧 global、新 Mac では存在しない
#
# 旧 ~/.tool-versions (asdf 互換 global) を使っていた場合は本ファイル導入後
# dead weight になるため、`rm ~/.tool-versions` で削除して良い。

[tools]
ruby = "3.3.0"
node = "26.12.1"
bun = "1.3.14"
python = "3.12.13"
go = "1.23.2"
rust = "1.76.0"
# Deno 2 は既定で OS の CA を見ないため、DENO_TLS_CA_STORE=system を
# tools/zsh/.zshrc で渡して社内 CA を信頼させる。
deno = "2.9.8"
# uv は nix (nix/darwin/packages.nix) でも入るが、nixpkgs の版が eMudhra 中間 CA
# 問題の修正版 (0.13.4) に届くまでは mise 版を PATH で優先させる。
uv = "0.13.4"
terraform = "1.8.3"
kubectl = "1.33.9"
awscli = "2.37.5"
# herdr は mise registry 未収載なので GitHub Release の binary を直接取る。
# Homebrew は Sonoma (Tier 3) 向け bottle を出さなくなったため brew から移した。
# 更新はここの version を上げて `mise install` (herdr 自身の self-update は使わない)。
"github:ogulcancelik/herdr" = "0.9.1"
